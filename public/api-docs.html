{
  "openapi": "3.0.3",
  "info": {
    "title": "Examify API Documentation",
    "version": "1.0.0",
    "description": "**Examify** is a production-grade, self-hosted AI Exam Generation & Assessment Platform built on Next.js 15 (App Router), MariaDB (Prisma ORM), Redis, and multi-model AI adapters (Google Gemini, OpenAI, Anthropic Claude, and Self-Hosted/vLLM/Ollama).\n\n### Core Security & Platform Highlights:\n- **Zero Cloudflare Dependencies**: Self-hosted Redis Sliding Window rate limiting and MaxMind GeoIP resolution.\n- **Strict Role-Based Access Control**: `ADMIN` and `TEACHER` roles with token blacklisting in Redis.\n- **Two-Factor Authentication (2FA)**: Built-in TOTP (Google Authenticator) with QR code setup and challenge verification.\n- **Anti-Prompt Injection Guard**: Advanced multi-tier sanitization and jailbreak defense for teacher custom instructions.\n- **Permanent Initialization Lock**: One-time initial setup endpoint locked permanently once root admin is created.\n- **Comprehensive Audit Trail**: Immutable system logs recording security events, authentication attempts, AI synthesis, and administrative updates.",
    "contact": {
      "name": "Examify Engineering Team",
      "email": "admin@examify.local",
      "url": "http://localhost:3000"
    },
    "license": {
      "name": "Proprietary"
    }
  },
  "servers": [
    {
      "url": "/api/v1",
      "description": "Examify API v1 Base Path"
    }
  ],
  "tags": [
    {
      "name": "Setup & System",
      "description": "Zero-day system initialization, connection diagnostics, and permanent lock management"
    },
    {
      "name": "Authentication & Profile",
      "description": "JWT issuance, session validation, 2FA TOTP challenges, password management, and user profiles"
    },
    {
      "name": "Curriculum",
      "description": "Hierarchical Vietnamese K-12 curriculum taxonomy (Levels -> Grades -> Subjects -> Semesters -> Topics -> Lessons)"
    },
    {
      "name": "Exams & Synthesis",
      "description": "Multi-AI exam generation, question regeneration, manual creation/editing, and cognitive matrix distribution"
    },
    {
      "name": "AI Configuration",
      "description": "Multi-provider AI model discovery (Gemini, OpenAI, Claude, Local/vLLM), API key management, and default model settings"
    },
    {
      "name": "Admin - Teachers",
      "description": "Teacher account administration, quota monitoring, role assignment, and 2FA reset (ADMIN only)"
    },
    {
      "name": "Admin - Security & GeoIP",
      "description": "Redis sliding-window rate limit tuning, GeoIP country blocking/whitelisting, and IP simulation testing (ADMIN only)"
    },
    {
      "name": "Admin - Audit Logs",
      "description": "System-wide immutable security, operational audit logging, and suspicious activity tracking (ADMIN only)"
    },
    {
      "name": "API Specifications",
      "description": "Live machine-readable OpenAPI 3.0.3 specification downloads (JSON and YAML)"
    }
  ],
  "components": {
    "securitySchemes": {
      "BearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Provide your JWT bearer token in the Authorization header (e.g. `Bearer eyJhbGciOi...`)."
      }
    },
    "schemas": {
      "StandardResponse": {
        "type": "object",
        "required": [
          "success"
        ],
        "properties": {
          "success": {
            "type": "boolean",
            "example": true
          },
          "message": {
            "type": "string",
            "example": "Operation completed successfully."
          },
          "data": {
            "type": "object"
          }
        }
      },
      "StandardError": {
        "type": "object",
        "required": [
          "success",
          "message"
        ],
        "properties": {
          "success": {
            "type": "boolean",
            "example": false
          },
          "message": {
            "type": "string",
            "example": "Resource not found or validation failure."
          },
          "code": {
            "type": "string",
            "example": "VALIDATION_ERROR"
          },
          "errors": {
            "type": "object",
            "description": "Field-level validation error details"
          }
        }
      },
      "UserResponse": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid",
            "example": "d3b07384-d113-460d-9b16-f288e2c4908a"
          },
          "email": {
            "type": "string",
            "format": "email",
            "example": "teacher@examify.local"
          },
          "fullName": {
            "type": "string",
            "example": "ThS. Nguyễn Văn An"
          },
          "role": {
            "type": "string",
            "enum": [
              "ADMIN",
              "TEACHER"
            ],
            "example": "TEACHER"
          },
          "school": {
            "type": "string",
            "example": "THPT Chuyên Trần Phú"
          },
          "twoFactorEnabled": {
            "type": "boolean",
            "example": false
          },
          "isActive": {
            "type": "boolean",
            "example": true
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "CognitiveMatrix": {
        "type": "object",
        "description": "Bloom taxonomy percentage distribution (must sum to 100%).",
        "properties": {
          "knowledge": {
            "type": "number",
            "minimum": 0,
            "maximum": 100,
            "example": 40,
            "description": "Nhận biết (%)"
          },
          "comprehension": {
            "type": "number",
            "minimum": 0,
            "maximum": 100,
            "example": 30,
            "description": "Thông hiểu (%)"
          },
          "application": {
            "type": "number",
            "minimum": 0,
            "maximum": 100,
            "example": 20,
            "description": "Vận dụng (%)"
          },
          "highApplication": {
            "type": "number",
            "minimum": 0,
            "maximum": 100,
            "example": 10,
            "description": "Vận dụng cao (%)"
          }
        }
      },
      "QuestionOption": {
        "type": "object",
        "properties": {
          "key": {
            "type": "string",
            "example": "A"
          },
          "text": {
            "type": "string",
            "example": "x = 2 hoặc x = -3"
          },
          "isCorrect": {
            "type": "boolean",
            "example": false
          }
        }
      },
      "Question": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "example": "q-1"
          },
          "questionNumber": {
            "type": "integer",
            "example": 1
          },
          "type": {
            "type": "string",
            "enum": [
              "multiple_choice",
              "true_false",
              "short_answer",
              "essay"
            ],
            "example": "multiple_choice"
          },
          "cognitiveLevel": {
            "type": "string",
            "enum": [
              "KNOWLEDGE",
              "COMPREHENSION",
              "APPLICATION",
              "HIGH_APPLICATION"
            ],
            "example": "COMPREHENSION"
          },
          "level": {
            "type": "string",
            "example": "Thông hiểu"
          },
          "content": {
            "type": "string",
            "example": "Cho hàm số \\(y = f(x)\\) có bảng biến thiên như hình vẽ. Số điểm cực trị của hàm số là:"
          },
          "options": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/QuestionOption"
            }
          },
          "correctAnswer": {
            "type": "string",
            "example": "B"
          },
          "explanation": {
            "type": "string",
            "example": "Đạo hàm đổi dấu 2 lần qua các điểm cực trị."
          },
          "points": {
            "type": "number",
            "example": 0.25
          }
        }
      },
      "ExamItem": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid",
            "example": "b1b52817-820d-41d9-adfe-55c8293546c1"
          },
          "title": {
            "type": "string",
            "example": "Đề thi Khảo sát chất lượng Toán 12 - Học kỳ 1"
          },
          "subject": {
            "type": "string",
            "example": "Toán học"
          },
          "grade": {
            "type": "string",
            "example": "Lớp 12"
          },
          "term": {
            "type": "string",
            "example": "Học kỳ 1"
          },
          "duration": {
            "type": "integer",
            "example": 90
          },
          "status": {
            "type": "string",
            "enum": [
              "approved",
              "review",
              "draft"
            ],
            "example": "approved"
          },
          "totalQuestions": {
            "type": "integer",
            "example": 22
          },
          "matrix": {
            "$ref": "#/components/schemas/CognitiveMatrix"
          },
          "questions": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Question"
            }
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "AuditLogItem": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "example": "log-102938"
          },
          "action": {
            "type": "string",
            "example": "EXAM_GENERATED"
          },
          "entity": {
            "type": "string",
            "example": "Exam"
          },
          "entityId": {
            "type": "string",
            "example": "b1b52817-820d-41d9-adfe-55c8293546c1"
          },
          "userId": {
            "type": "string",
            "example": "usr-admin-01"
          },
          "user": {
            "type": "object",
            "properties": {
              "fullName": {
                "type": "string",
                "example": "Nguyễn Văn An"
              },
              "email": {
                "type": "string",
                "example": "an.nguyen@spt.edu.vn"
              }
            }
          },
          "clientIp": {
            "type": "string",
            "example": "14.161.22.45"
          },
          "country": {
            "type": "string",
            "example": "VN"
          },
          "userAgent": {
            "type": "string",
            "example": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          },
          "details": {
            "type": "object"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "TeacherItem": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "example": "GV-001"
          },
          "name": {
            "type": "string",
            "example": "ThS. Nguyễn Văn An"
          },
          "email": {
            "type": "string",
            "example": "an.nguyen@spt.edu.vn"
          },
          "role": {
            "type": "string",
            "example": "Tổ trưởng chuyên môn"
          },
          "department": {
            "type": "string",
            "example": "Toán - Tin học"
          },
          "twoFactorEnabled": {
            "type": "boolean",
            "example": true
          },
          "status": {
            "type": "string",
            "enum": [
              "active",
              "suspended"
            ],
            "example": "active"
          },
          "tokensUsed": {
            "type": "integer",
            "example": 142500
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "ModelInfo": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "example": "gemini-2.0-flash"
          },
          "name": {
            "type": "string",
            "example": "Gemini 2.0 Flash"
          },
          "provider": {
            "type": "string",
            "enum": [
              "gemini",
              "openai",
              "claude",
              "self-hosted"
            ],
            "example": "gemini"
          },
          "description": {
            "type": "string",
            "example": "High performance, low latency generation"
          },
          "isDefault": {
            "type": "boolean",
            "example": true
          }
        }
      }
    }
  },
  "paths": {
    "/setup": {
      "get": {
        "tags": [
          "Setup & System"
        ],
        "summary": "Kiểm tra trạng thái khởi tạo hệ thống (Setup Status)",
        "description": "Kiểm tra xem hệ thống đã được cấu hình tài khoản Quản trị viên tối cao (root ADMIN) hay chưa.",
        "responses": {
          "200": {
            "description": "Trạng thái khởi tạo của hệ thống",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "success": {
                      "type": "boolean",
                      "example": true
                    },
                    "data": {
                      "type": "object",
                      "properties": {
                        "isInitialized": {
                          "type": "boolean",
                          "example": true
                        },
                        "setupRequired": {
                          "type": "boolean",
                          "example": false
                        },
                        "institutionName": {
                          "type": "string",
                          "example": "Trường THPT Chuyên Trần Phú"
                        },
                        "adminEmail": {
                          "type": "string",
                          "example": "admin@examify.local"
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      },
      "post": {
        "tags": [
          "Setup & System"
        ],
        "summary": "Khởi tạo hệ thống lần đầu & Tạo Root ADMIN (Khóa vĩnh viễn sau đó)",
        "description": "Tạo tài khoản Quản trị viên tối cao và cấu hình hệ thống ban đầu (MySQL, Redis, AI API keys). Sau khi tạo thành công, endpoint này bị khóa vĩnh viễn (HTTP 403).",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "email",
                  "password",
                  "fullName",
                  "institutionName"
                ],
                "properties": {
                  "email": {
                    "type": "string",
                    "format": "email",
                    "example": "admin@examify.local"
                  },
                  "password": {
                    "type": "string",
                    "minLength": 8,
                    "example": "AdminP@ssw0rd2026"
                  },
                  "fullName": {
                    "type": "string",
                    "example": "Quản trị viên Hệ thống"
                  },
                  "institutionName": {
                    "type": "string",
                    "example": "Trường THPT Chuyên Trần Phú"
                  },
                  "database": {
                    "type": "object",
                    "properties": {
                      "host": {
                        "type": "string",
                        "default": "localhost"
                      },
                      "port": {
                        "type": "integer",
                        "default": 3306
                      },
                      "user": {
                        "type": "string",
                        "default": "root"
                      },
                      "password": {
                        "type": "string",
                        "default": ""
                      },
                      "database": {
                        "type": "string",
                        "default": "examify"
                      }
                    }
                  },
                  "redis": {
                    "type": "object",
                    "properties": {
                      "enabled": {
                        "type": "boolean",
                        "default": false
                      },
                      "host": {
                        "type": "string",
                        "default": "localhost"
                      },
                      "port": {
                        "type": "integer",
                        "default": 6379
                      },
                      "password": {
                        "type": "string",
                        "default": ""
                      },
                      "db": {
                        "type": "integer",
                        "default": 0
                      }
                    }
                  },
                  "ai": {
                    "type": "object",
                    "properties": {
                      "defaultProvider": {
                        "type": "string",
                        "enum": [
                          "gemini",
                          "openai",
                          "claude",
                          "self-hosted"
                        ],
                        "default": "gemini"
                      },
                      "geminiApiKey": {
                        "type": "string",
                        "example": "AIzaSy..."
                      },
                      "geminiModel": {
                        "type": "string",
                        "default": "gemini-2.0-flash"
                      },
                      "openaiApiKey": {
                        "type": "string",
                        "example": "sk-proj-..."
                      },
                      "openaiModel": {
                        "type": "string",
                        "default": "gpt-4o-mini"
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Khởi tạo hệ thống thành công và trả về JWT Bearer token",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "success": {
                      "type": "boolean",
                      "example": true
                    },
                    "message": {
                      "type": "string",
                      "example": "Hệ thống đã được thiết lập thành công."
                    },
                    "data": {
                      "type": "object",
                      "properties": {
                        "token": {
                          "type": "string",
                          "example": "eyJhbGciOiJIUzI1Ni..."
                        },
                        "user": {
                          "$ref": "#/components/schemas/UserResponse"
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "403": {
            "description": "Hệ thống đã được khởi tạo trước đó. Không thể thiết lập lại.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/StandardError"
                }
              }
            }
          }
        }
      }
    },
    "/setup/test-connection": {
      "post": {
        "tags": [
          "Setup & System"
        ],
        "summary": "Kiểm tra kết nối dịch vụ (MySQL, Redis, AI Provider)",
        "description": "Kiểm tra tính hợp lệ và độ trễ phản hồi (latency) của cơ sở dữ liệu MySQL, Redis Cache hoặc API key của các nhà cung cấp AI.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "type",
                  "config"
                ],
                "properties": {
                  "type": {
                    "type": "string",
                    "enum": [
                      "mysql",
                      "redis",
                      "gemini",
                      "openai",
                      "claude",
                      "self-hosted"
                    ],
                    "example": "gemini"
                  },
                  "config": {
                    "type": "object",
                    "description": "Thông tin kết nối tương ứng với từng loại dịch vụ",
                    "example": {
                      "apiKey": "AIzaSy..."
                    }
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Kết nối kiểm tra thành công",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "success": {
                      "type": "boolean",
                      "example": true
                    },
                    "message": {
                      "type": "string",
                      "example": "Kết nối Google Gemini thành công"
                    },
                    "data": {
                      "type": "object",
                      "properties": {
                        "latencyMs": {
                          "type": "integer",
                          "example": 320
                        },
                        "modelCount": {
                          "type": "integer",
                          "example": 12
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Kết nối thất bại hoặc thông số không hợp lệ",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/StandardError"
                }
              }
            }
          }
        }
      }
    },
    "/auth/login": {
      "post": {
        "tags": [
          "Authentication & Profile"
        ],
        "summary": "Đăng nhập người dùng & Cấp phiên JWT",
        "description": "Xác thực tài khoản bằng email và mật khẩu. Nếu tài khoản bật xác thực hai yếu tố (2FA), hệ thống trả về mã `requires2FA: true` và `tempToken` để tiếp tục xác thực TOTP.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "email",
                  "password"
                ],
                "properties": {
                  "email": {
                    "type": "string",
                    "format": "email",
                    "example": "teacher@examify.local"
                  },
                  "password": {
                    "type": "string",
                    "example": "TeacherP@ss123"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Đăng nhập thành công (hoặc yêu cầu mã 2FA)",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "success": {
                      "type": "boolean",
                      "example": true
                    },
                    "data": {
                      "type": "object",
                      "properties": {
                        "token": {
                          "type": "string",
                          "example": "eyJhbGciOiJIUzI1Ni..."
                        },
                        "user": {
                          "$ref": "#/components/schemas/UserResponse"
                        },
                        "requires2FA": {
                          "type": "boolean",
                          "example": false
                        },
                        "tempToken": {
                          "type": "string",
                          "description": "Token tạm thời dùng cho bước verify 2FA"
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "401": {
